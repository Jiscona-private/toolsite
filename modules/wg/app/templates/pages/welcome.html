<!doctype html>
<!-- No base.html here on purpose: design.md §5.1 "Beitreten" has no bottom
     bar/avatar - those only make sense once a member is picked. -->
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("welcome.title") }}</title>
    <link rel="stylesheet" href="{{ base_path }}/static/css/app.css" />
  </head>
  <body>
    <main class="page stack">
      <h1>{{ t("welcome.title") }}</h1>
      <p>{{ t("welcome.subtitle") }}</p>

      {% if error %}
        <p class="card text-error" role="alert">
          {{ t("welcome.invalid_choice") }}
        </p>
      {% endif %}

      {% if members %}
        <form method="post" action="{{ base_path }}/welcome" class="card stack">
          <input type="hidden" name="lang" value="{{ lang }}" />
          {% for member in members %}
            <button type="submit" name="member_id" value="{{ member.id }}" class="btn secondary full">
              {{ member.name }}
            </button>
          {% endfor %}
        </form>
      {% else %}
        <p class="card">{{ t("welcome.no_members") }}</p>
      {% endif %}

      <nav aria-label="{{ t('welcome.language_label') }}" class="stack">
        <a class="btn secondary" href="{{ base_path }}/welcome?lang=de">Deutsch</a>
        <a class="btn secondary" href="{{ base_path }}/welcome?lang=en">English</a>
      </nav>

      <p class="text-muted">{{ t("welcome.hint") }}</p>
    </main>
  </body>
</html>
