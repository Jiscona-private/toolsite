<!doctype html>
<!-- No base.html here on purpose: design.md §5.1 "Beitreten" has no bottom
     bar/avatar - those only make sense once a member is picked. -->
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("welcome.title") }}</title>
    <link rel="stylesheet" href="{{ base_path }}/static/css/app.css" />
  </head>
  <body>
    <main class="page stack">
      <div class="welcome-header">
        <span class="app-icon" aria-hidden="true">
          <svg aria-hidden="true"><use href="{{ base_path }}/static/icons/sprite.svg#icon-app"></use></svg>
        </span>
        <h1>{{ t("welcome.title") }}</h1>
        <p class="text-muted">{{ t("welcome.subtitle") }}</p>
      </div>

      {% if error %}
        <p class="card text-error" role="alert">
          {{ t("welcome.invalid_choice") }}
        </p>
      {% endif %}

      {% if members %}
        <form method="post" action="{{ base_path }}/welcome" class="stack">
          <input type="hidden" name="lang" value="{{ lang }}" />
          {% for member in members %}
            <button type="submit" name="member_id" value="{{ member.id }}" class="choice-row">
              <span class="avatar color-{{ member.color }}" aria-hidden="true">{{ member.name[0] }}</span>
              {{ member.name }}
            </button>
          {% endfor %}
        </form>
      {% else %}
        <p class="card">{{ t("welcome.no_members") }}</p>
      {% endif %}

      <div class="align-center">
        <div class="segment" role="group" aria-label="{{ t('welcome.language_label') }}">
          <a
            class="{{ 'active' if lang == 'de' else '' }}"
            aria-pressed="{{ 'true' if lang == 'de' else 'false' }}"
            href="{{ base_path }}/welcome?lang=de"
          >Deutsch</a>
          <a
            class="{{ 'active' if lang == 'en' else '' }}"
            aria-pressed="{{ 'true' if lang == 'en' else 'false' }}"
            href="{{ base_path }}/welcome?lang=en"
          >English</a>
        </div>
      </div>

      <p class="card text-muted">{{ t("welcome.hint") }}</p>
    </main>
  </body>
</html>
