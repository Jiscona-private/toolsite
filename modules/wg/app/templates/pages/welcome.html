<!doctype html>
<!-- Plain and unstyled on purpose: app.css/base.html land in Phase 1 step 5
     (Grundlayout). This page already has to exist for the access gate
     (step 4), so it gets the bare minimum until then. -->
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("welcome.title") }}</title>
  </head>
  <body>
    <main>
      <h1>{{ t("welcome.title") }}</h1>
      <p>{{ t("welcome.subtitle") }}</p>

      {% if error %}
        <p role="alert">{{ t("welcome.invalid_choice") }}</p>
      {% endif %}

      {% if members %}
        <form method="post" action="{{ base_path }}/welcome">
          <input type="hidden" name="lang" value="{{ lang }}" />
          {% for member in members %}
            <button type="submit" name="member_id" value="{{ member.id }}">
              {{ member.name }}
            </button>
          {% endfor %}
        </form>
      {% else %}
        <p>{{ t("welcome.no_members") }}</p>
      {% endif %}

      <nav aria-label="{{ t('welcome.language_label') }}">
        <a href="{{ base_path }}/welcome?lang=de">Deutsch</a>
        <a href="{{ base_path }}/welcome?lang=en">English</a>
      </nav>

      <p>{{ t("welcome.hint") }}</p>
    </main>
  </body>
</html>
