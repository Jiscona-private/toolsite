services:
  ea-heidelberg:
    # Static files only, same pattern as modules/hoema: a tiny Caddy file
    # server, no build step. Files are bind-mounted, so publishing changes
    # only needs `git pull` on the server — no rebuild or restart.
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":3000"]
    volumes:
      # Served under /srv/ea-heidelberg so the /ea-heidelberg prefix that the
      # main Caddy forwards unchanged (handle, not handle_path) maps onto
      # real paths.
      - ./public:/srv/ea-heidelberg:ro
    networks:
      - toolsite_net

networks:
  toolsite_net:
    name: toolsite_net
