<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WG-App – Beitreten</title>
<!-- Referenz-Mockup aus der Design-Vorschau (Planungsphase). Inline-Styles nur fuer das Mockup; in der App alles ueber Klassen in app/static/css/app.css. Google-Fonts-Link nur hier zur Ansicht; die App hostet Schriften selbst. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F6F5C}a:hover{color:#174F42}
</style>
<style>html{background:#D9DCD5}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 0;box-sizing:border-box}@media (max-width:420px){body{padding:0}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F5F1; font-family: 'Figtree', sans-serif; color: #1B1F1D; padding: 72px 24px 32px; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 24px; background: #1F6F5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"></path><path d="M8.5 14.5l2.5 2.5 4.5-4.5"></path></svg></span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Willkommen in der WG</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #4A524E; max-width: 300px">Wer bist du? Die App merkt sich deine Auswahl auf diesem Gerät.</p>
</div>

<nav aria-label="Namen wählen" style="display: flex; flex-direction: column; gap: 10px">
<a href="Main.html" style="height: 60px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E5DF; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1B1F1D; font-size: 17px; font-weight: 600"><span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: #DCEBE5; color: #1F6F5C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">J</span>Jakob</a>
<a href="Main.html" style="height: 60px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E5DF; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1B1F1D; font-size: 17px; font-weight: 600"><span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: #E4E6F7; color: #3B4A9E; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">C</span>Clara</a>
<a href="Main.html" style="height: 60px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E5DF; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1B1F1D; font-size: 17px; font-weight: 600"><span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: #FBE7D3; color: #8A4B07; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">D</span>Daniel</a>
<a href="Main.html" style="height: 60px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E5DF; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1B1F1D; font-size: 17px; font-weight: 600"><span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 19px; background: #EDE3F3; color: #6B3F8A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">B</span>Bato</a>
</nav>

<div role="group" aria-label="Sprache" style="display: flex; align-self: center; background: #E7E9E3; border-radius: 12px; padding: 4px; gap: 4px">
<button type="button" aria-pressed="true" style="height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: #FFFFFF; color: #1B1F1D; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 700">Deutsch</button>
<button type="button" aria-pressed="false" style="height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: transparent; color: #4A524E; font-family: 'Figtree', sans-serif; font-size: 15px; font-weight: 600">English</button>
</div>

<p style="margin: auto 0 0; font-size: 13.5px; line-height: 1.45; color: #5B635F; text-align: center">Kein Passwort nötig: Wer diesen Link hat, gehört zur WG. Teile ihn nur in eurer WG-Gruppe.</p>
</div>
</body>
</html>
